<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f3f2ee" />
    <title>ARKFARIN — код, идеи и немного хаоса</title>
    <meta
      name="description"
      content="Arkfarin — Python-разработчик и вайб-кодер. Автоматизирую скучное, собираю инструменты и проверяю идеи на практике."
    />
    <meta property="og:title" content="ARKFARIN — код, идеи и немного хаоса" />
    <meta
      property="og:description"
      content="Пишу на Python. Автоматизирую скучное. Личное пространство Arkfarin."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ark.farin.cc/" />
    <link rel="canonical" href="https://ark.farin.cc/" />
    <link rel="icon" href="%BASE_URL%assets/favicon.png" type="image/png" />
    <link
      rel="preload"
      href="%BASE_URL%assets/display.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link
      rel="preload"
      href="%BASE_URL%assets/body.woff"
      as="font"
      type="font/woff"
      crossorigin
    />
    <link rel="stylesheet" href="%BASE_URL%preloader.css" />
    <script src="%BASE_URL%theme-init.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body>
    <div
      id="preloader"
      class="preloader"
      role="progressbar"
      aria-label="Загрузка сайта"
      aria-valuemin="0"
      aria-valuemax="100"
      aria-valuenow="0"
    >
      <div class="preloader-word" aria-hidden="true">
        <span class="preloader-letter" style="--letter: 0">A</span
        ><span class="preloader-letter" style="--letter: 1">R</span
        ><span class="preloader-letter" style="--letter: 2">K</span
        ><span class="preloader-letter" style="--letter: 3">F</span
        ><span class="preloader-letter" style="--letter: 4">A</span
        ><span class="preloader-letter" style="--letter: 5">R</span
        ><span class="preloader-letter" style="--letter: 6">I</span
        ><span class="preloader-letter" style="--letter: 7">N</span>
        <span class="preloader-fill"
          ><span class="preloader-letter" style="--letter: 0">A</span
          ><span class="preloader-letter" style="--letter: 1">R</span
          ><span class="preloader-letter" style="--letter: 2">K</span
          ><span class="preloader-letter" style="--letter: 3">F</span
          ><span class="preloader-letter" style="--letter: 4">A</span
          ><span class="preloader-letter" style="--letter: 5">R</span
          ><span class="preloader-letter" style="--letter: 6">I</span
          ><span class="preloader-letter" style="--letter: 7">N</span></span
        >
      </div>
    </div>
    <div id="root"></div>
  </body>
</html>

<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="ЗВУК ТУТ — интерактивная карта точек выдачи наушников.">
  <title>ЗВУК ТУТ — наушники напрокат</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <style>
    :root {
      color-scheme:light;
      --acid:#e4ff15; --blue:#151df3; --ink:#17181a; --muted:#777a84;
      font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
      font-synthesis:none;
    }
    * {box-sizing:border-box}
    [hidden] {display:none!important}
    html,body {margin:0;width:100%;height:100%;overflow:hidden;background:#e5e9e8;color:var(--ink)}
    button {font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
    button:focus-visible {outline:3px solid var(--blue);outline-offset:3px}
    .app {height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
    .header {height:70px;flex:none;display:flex;align-items:center;padding:0 18px;gap:13px;background:#fff;border-bottom:1px solid #e9e9ee;position:relative;z-index:900}
    .logo {width:44px;height:44px;flex:none;background:var(--acid);border:3px solid #131313;border-radius:14px;display:grid;place-items:center;font-size:24px;transform:rotate(-7deg)}
    .title {font-size:22px;line-height:1;font-weight:1000;letter-spacing:-1.2px;white-space:nowrap}
    .title span {color:var(--blue)}
    .subtitle {font-size:10px;letter-spacing:1.35px;font-weight:800;color:#757982;margin-top:5px}
    .map-shell {position:relative;flex:1;min-height:0;overflow:hidden}
    #map {width:100%;height:100%;background:#dce6df}
    .map-pill {position:absolute;z-index:500;top:17px;left:17px;background:#fff;box-shadow:0 5px 24px #10182822;border-radius:13px;padding:11px 14px;font-size:12px;font-weight:900;display:flex;gap:9px;align-items:center;pointer-events:none}
    .green-dot {width:8px;height:8px;flex:none;background:#26a56c;border-radius:50%}
    .map-actions {position:absolute;z-index:500;top:17px;right:17px;display:flex;flex-direction:column;gap:9px}
    .map-actions button {width:46px;height:46px;border:1px solid #e8e9eb;border-radius:13px;background:#fff;display:grid;place-items:center;box-shadow:0 5px 24px #10182822}
    .map-actions button:active {transform:scale(.96)}
    .map-actions svg,.scan-icon {width:22px;height:22px;stroke:currentColor;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round}
    .primary-wrap {position:absolute;z-index:600;bottom:calc(26px + env(safe-area-inset-bottom, 0px));left:50%;transform:translateX(-50%);width:min(440px,calc(100% - 36px));pointer-events:none}
    .primary {pointer-events:auto;width:100%;height:66px;background:var(--acid);border:3px solid #121212;border-radius:19px;box-shadow:0 6px 0 #161616,0 12px 28px #0003;display:flex;align-items:center;justify-content:center;gap:13px;font-size:17px;font-weight:950;letter-spacing:-.3px}
    .primary:active {transform:translateY(4px);box-shadow:0 2px 0 #161616,0 7px 18px #0003}
    .leaflet-container {font-family:inherit}
    .leaflet-control-zoom {display:none}
    .leaflet-control-attribution {font-size:9px!important}
    .pin-container {border:0!important;background:transparent!important}
    .pin {width:52px;height:52px;background:var(--acid);border:3px solid #161616;border-radius:16px 16px 16px 6px;box-shadow:0 5px 0 #121212,0 9px 17px #0004;display:grid;place-items:center;transform:rotate(-8deg);font-size:24px;position:relative}
    .pin span {transform:rotate(8deg)}
    .pin b {position:absolute;right:-12px;top:-11px;border:2px solid white;border-radius:20px;background:#151515;color:#fff;min-width:23px;height:23px;padding:2px 4px;text-align:center;font-size:11px;font-weight:900;transform:rotate(8deg)}
    .leaflet-popup-content-wrapper {border-radius:16px;box-shadow:0 14px 40px #10182830}
    .leaflet-popup-content {margin:14px 17px;line-height:1.4}
    .popup-title {font-size:15px;font-weight:950;margin-bottom:4px}
    .popup-address {font-size:12px;color:#676c74}
    .toast {position:fixed;z-index:2000;left:50%;top:82px;transform:translateX(-50%) translateY(-10px);width:max-content;max-width:min(92vw,430px);border-radius:13px;background:#16181b;color:#fff;font-size:13px;line-height:1.45;font-weight:700;padding:12px 16px;text-align:center;box-shadow:0 8px 28px #0004;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
    .toast.show {opacity:1;transform:translateX(-50%) translateY(0)}
    dialog {border:0;padding:0;width:min(420px,calc(100vw - 30px));max-height:calc(100dvh - 30px);overflow:auto;border-radius:22px;color:var(--ink);box-shadow:0 20px 80px #0006;background:#fff}
    dialog::backdrop {background:#080c1bc4;backdrop-filter:blur(3px)}
    .dialog-inner {padding:22px}
    .dialog-top {display:flex;align-items:center;justify-content:space-between;gap:12px}
    .dialog-heading {margin:0;font-size:22px;font-weight:950;letter-spacing:-.7px}
    .icon-button {width:36px;height:36px;display:grid;place-items:center;border:0;border-radius:11px;background:#f0f1f3;font-size:22px;line-height:1}
    .dialog-intro {margin:9px 0 17px;color:#626771;font-size:13px;line-height:1.5}
    .reader-box {width:100%;min-height:225px;border-radius:16px;background:#15171c;overflow:hidden;display:grid;place-items:center;color:white}
    #reader {width:100%;min-width:0;overflow:hidden}
    #reader video {width:100%!important;max-height:46dvh!important;object-fit:cover;border-radius:12px}
    #reader img {max-width:100%!important}
    .reader-placeholder {padding:25px;text-align:center;font-size:12px;color:#aeb2ba}
    .scan-status {margin:13px 0 0;font-size:12px;min-height:33px;color:#737780;line-height:1.45;text-align:center}
    .scan-status.error {color:#c03d3d;font-weight:750}
    .dialog-actions {display:flex;gap:10px;margin-top:14px}
    .secondary-button {flex:1;min-width:0;padding:13px 10px;background:#f1f2f4;border:0;border-radius:12px;font-weight:850;font-size:12px}
    .secondary-button.accent {background:var(--acid)}
    .success {padding:33px 22px 24px;text-align:center}
    .success-icon {width:82px;height:82px;border-radius:25px;background:var(--acid);display:grid;place-items:center;font-size:42px;font-weight:950;margin:0 auto 20px;transform:rotate(-7deg)}
    .success h2 {font-size:25px;line-height:1.1;letter-spacing:-.9px;margin:0 0 10px}
    .success p {color:#676b73;font-size:14px;line-height:1.5;margin:0 0 22px}
    .success button {width:100%;background:#17181a;color:#fff;border:0;border-radius:13px;padding:15px;font-weight:900}
    @media(max-width:600px) {
      .header {height:66px;padding:0 13px;gap:11px}
      .logo {width:41px;height:41px;border-width:2.5px;font-size:22px}
      .title {font-size:20px}.subtitle {font-size:9px}
      .map-pill {top:12px;left:12px;font-size:11px;padding:10px 12px}
      .map-actions {top:12px;right:12px}.map-actions button {width:43px;height:43px}
      .primary-wrap {bottom:calc(21px + env(safe-area-inset-bottom, 0px))}
      .primary {height:62px;font-size:16px}
      .pin {width:47px;height:47px;font-size:22px}
      .toast {top:76px}
    }
    @media(max-width:360px){.map-pill{font-size:10px}.title{font-size:18px}}
    @media(prefers-reduced-motion:reduce){.toast{transition:none!important}}
  </style>
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo" aria-hidden="true">🎧</div>
      <div>
        <div class="title">ЗВУК <span>ТУТ.</span></div>
        <div class="subtitle">НАУШНИКИ НАПРОКАТ</div>
      </div>
    </header>
    <main class="map-shell" aria-label="Карта точек выдачи наушников">
      <div id="map"></div>
      <div class="map-pill"><span class="green-dot"></span>БИШКЕК · 6 ТОЧЕК</div>
      <div class="map-actions">
        <button id="showAll" type="button" aria-label="Все точки на карте" title="Все точки">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>
        </button>
        <button id="locate" type="button" aria-label="Моё местоположение" title="Моё местоположение">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3"/></svg>
        </button>
      </div>
      <div class="primary-wrap">
        <button id="scanButton" class="primary" type="button">
          <svg class="scan-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M3 16v3a2 2 0 0 0 2 2h3M21 16v3a2 2 0 0 1-2 2h-3"/><rect x="7" y="7" width="4" height="4"/><path d="M15 7h2v2h-2zM7 15h2v2H7zM13 13h4v4h-4z"/></svg>
          Получить наушники
        </button>
      </div>
    </main>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="scannerDialog" aria-labelledby="scannerHeading">
    <section id="scanView" class="dialog-inner">
      <div class="dialog-top"><h1 id="scannerHeading" class="dialog-heading">Сканировать QR</h1><button id="closeScanner" type="button" class="icon-button" aria-label="Закрыть">×</button></div>
      <p class="dialog-intro">Наведи камеру на QR-код точки выдачи.</p>
      <div class="reader-box"><div id="reader"><div class="reader-placeholder">Подключаем камеру…</div></div></div>
      <p id="scanStatus" class="scan-status" role="status" aria-live="polite">Запускаем камеру…</p>
      <div class="dialog-actions">
        <button id="retryCamera" class="secondary-button" type="button">Включить камеру</button>
        <button id="chooseImage" class="secondary-button accent" type="button">QR из галереи</button>
      </div>
      <input id="imageInput" type="file" accept="image/*" hidden aria-label="Загрузить изображение QR-кода">
    </section>
    <section id="successView" class="success" hidden aria-live="polite">
      <div class="success-icon" aria-hidden="true">✓</div>
      <h2>Наушники получены!</h2>
      <p id="successStation"></p>
      <button id="finishScan" type="button">Отлично</button>
    </section>
  </dialog>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <script>
    'use strict';

    // Точки нужны только для отображения на карте, выдача не изменяет данные.
    const STATIONS = [
      {id:1, name:'Центральная площадь', area:'Центр · Чуй / пр. Эркиндик', lat:42.8754, lng:74.6038},
      {id:2, name:'Западный квартал', area:'Центр · западная часть', lat:42.8741, lng:74.5880},
      {id:3, name:'Университетский район', area:'Юг · учебный квартал', lat:42.8626, lng:74.6021},
      {id:4, name:'Восточный парк', area:'Восток · парковая зона', lat:42.8767, lng:74.6222},
      {id:5, name:'Городской проспект', area:'Север · главная улица', lat:42.8877, lng:74.6058},
      {id:6, name:'Южный квартал', area:'Юг · жилой район', lat:42.8533, lng:74.6146}
    ];
    const $ = id => document.getElementById(id);
    let toastTimeout;
    function toast(message){
      const el=$('toast');el.textContent=message;el.classList.add('show');
      clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.classList.remove('show'),4500);
    }

    const map=L.map('map',{zoomControl:false}).setView([42.8735,74.6040],13);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{
      maxZoom:19,attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap</a> contributors'
    }).addTo(map);
    const bounds=L.latLngBounds(STATIONS.map(s=>[s.lat,s.lng]));
    for(const station of STATIONS){
      const icon=L.divIcon({
        className:'pin-container', iconSize:[52,57], iconAnchor:[26,50], popupAnchor:[0,-46],
        html:`<div class="pin"><span>🎧</span><b>${station.id}</b></div>`
      });
      L.marker([station.lat,station.lng],{icon,title:station.name})
        .addTo(map)
        .bindPopup(`<div class="popup-title">${station.name}</div><div class="popup-address">${station.area}</div>`);
    }
    $('showAll').addEventListener('click',()=>map.fitBounds(bounds,{padding:[50,50],maxZoom:14}));

    let positionDot=null,accuracyCircle=null;
    $('locate').addEventListener('click',()=>{
      if(!window.isSecureContext){
        toast('Для GPS нужен HTTPS. Открой сайт через GitHub Pages или localhost.');
        return;
      }
      if(!navigator.geolocation){toast('Геолокация недоступна в этом браузере.');return;}
      toast('Определяем местоположение…');
      navigator.geolocation.getCurrentPosition(position=>{
        const point=[position.coords.latitude,position.coords.longitude];
        if(positionDot)map.removeLayer(positionDot);
        if(accuracyCircle)map.removeLayer(accuracyCircle);
        accuracyCircle=L.circle(point,{
          radius:position.coords.accuracy,color:'#151df3',weight:1.5,fillColor:'#151df3',fillOpacity:.08,interactive:false
        }).addTo(map);
        positionDot=L.circleMarker(point,{
          radius:9,color:'#fff',weight:3,fillColor:'#151df3',fillOpacity:1
        }).addTo(map).bindPopup('Вы здесь');
        map.flyTo(point,15,{duration:.6});
        toast(`Местоположение найдено · точность около ${Math.round(position.coords.accuracy)} м`);
      },error=>{
        const messages={
          1:'Доступ к геолокации запрещён. Разреши его в настройках сайта Chrome.',
          2:'Местоположение недоступно. Включи геолокацию на телефоне.',
          3:'Не удалось определить местоположение вовремя. Попробуй снова.'
        };
        toast(messages[error.code]||'Не удалось получить местоположение.');
      },{enableHighAccuracy:true,timeout:20000,maximumAge:10000});
    });

    const qrDialog=$('scannerDialog');
    let qrReader=null;
    let qrStartPromise=null;
    let scanGeneration=0;
    let scanAccepted=false;
    function setScanStatus(message,error=false){
      $('scanStatus').textContent=message;
      $('scanStatus').classList.toggle('error',error);
    }
    async function releaseReader(){
      ++scanGeneration;
      const reader=qrReader,starting=qrStartPromise;
      qrReader=null;qrStartPromise=null;
      if(!reader)return;
      try{if(starting)await starting;}catch{}
      try{await reader.stop();}catch{}
      try{reader.clear();}catch{}
    }
    function scanned(text){
      if(scanAccepted||!qrDialog.open)return;
      const match=/^ITS_TEST_([1-6])$/.exec(text.trim());
      if(!match){setScanStatus('Неподходящий QR-код. Нужен код точки выдачи.',true);return;}
      scanAccepted=true;
      const station=STATIONS.find(s=>s.id===Number(match[1]));
      $('successStation').textContent=`Точка №${station.id} · ${station.name}`;
      $('scanView').hidden=true;
      $('successView').hidden=false;
      void releaseReader();
    }
    async function startCamera(){
      await releaseReader();
      if(!qrDialog.open||scanAccepted)return;
      if(!window.isSecureContext){
        setScanStatus('Камера работает только через HTTPS или localhost. Открой сайт на GitHub Pages.',true);
        return;
      }
      if(!navigator.mediaDevices?.getUserMedia){
        setScanStatus('Браузер не предоставляет доступ к камере.',true);
        return;
      }
      if(typeof Html5Qrcode==='undefined'){
        setScanStatus('Не удалось загрузить сканер. Проверь интернет-соединение.',true);
        return;
      }
      const generation=++scanGeneration;
      setScanStatus('Разреши доступ к камере, если появится запрос.');
      const reader=new Html5Qrcode('reader',{
        formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false
      });
      qrReader=reader;
      try{
        const starting=reader.start(
          {facingMode:'environment'},
          {fps:10,qrbox:(width,height)=>({width:Math.max(130,Math.min(240,width-20)),height:Math.max(130,Math.min(240,height-20))})},
          scanned,
          ()=>{}
        );
        qrStartPromise=starting;
        await starting;
        if(generation!==scanGeneration||!qrDialog.open||scanAccepted)return;
        setScanStatus('Помести QR-код в рамку камеры.');
      }catch(error){
        if(generation!==scanGeneration)return;
        setScanStatus('Не удалось включить камеру. Проверь разрешение или выбери QR из галереи.',true);
      }
    }
    function openScanner(){
      if(typeof qrDialog.showModal!=='function'){toast('Сканер не поддерживается этим браузером.');return;}
      scanAccepted=false;
      $('scanView').hidden=false;
      $('successView').hidden=true;
      $('imageInput').value='';
      $('reader').innerHTML='';
      setScanStatus('Запускаем камеру…');
      qrDialog.showModal();
      void startCamera();
    }
    $('scanButton').addEventListener('click',openScanner);
    $('retryCamera').addEventListener('click',()=>{if(!scanAccepted)void startCamera();});
    $('chooseImage').addEventListener('click',()=>$('imageInput').click());
    $('imageInput').addEventListener('change',async event=>{
      const file=event.target.files?.[0];
      if(!file||scanAccepted)return;
      await releaseReader();
      if(!qrDialog.open||scanAccepted)return;
      if(typeof Html5Qrcode==='undefined'){
        setScanStatus('Не удалось загрузить QR-сканер. Проверь соединение.',true);
        return;
      }
      setScanStatus('Проверяем QR-код на изображении…');
      const reader=new Html5Qrcode('reader',{
        formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],verbose:false
      });
      qrReader=reader;
      try{
        const result=await reader.scanFile(file,true);
        scanned(result);
      }catch{
        if(qrDialog.open&&!scanAccepted)setScanStatus('QR-код не найден на изображении. Попробуй другое фото.',true);
      }finally{
        if(qrReader===reader)await releaseReader();
        $('imageInput').value='';
      }
    });
    $('closeScanner').addEventListener('click',()=>qrDialog.close());
    $('finishScan').addEventListener('click',()=>qrDialog.close());
    qrDialog.addEventListener('close',()=>{scanAccepted=true;void releaseReader();});
    // Корректно отпускаем камеру при закрытии вкладки или переходе в фон.
    document.addEventListener('visibilitychange',()=>{
      if(document.hidden&&qrDialog.open&&$('scanView').hidden===false){
        void releaseReader();setScanStatus('Камера остановлена. Нажми «Включить камеру», чтобы продолжить.');
      }
    });
    window.addEventListener('pagehide',()=>{void releaseReader();});
  </script>
</body>
</html>
